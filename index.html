  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Prata&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Editable: color system */
      --bg-ivory: #f8f3ed;
      --bg-cream: #fff9f4;
      --bg-champagne: #f2e8dc;
      --accent-blush: #e9d2cf;
      --accent-sage: #dbe3d5;
      --text-primary: #111111;
      --text-soft: #161616;
      --glass: rgba(255, 255, 255, 0.38);
      --line: rgba(120, 94, 83, 0.2);
      --shadow-soft: 0 1.125vw 4.5vw rgba(145, 116, 101, 0.13);
      --radius: 1.5vw;
      --ease-premium: cubic-bezier(0.2, 0.8, 0.2, 1);
      --font-heading: "Prata", Georgia, "Times New Roman", serif;
      --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      background: radial-gradient(circle at 18% 18%, #fffdf9, var(--bg-cream) 34%, var(--bg-ivory) 63%, var(--bg-champagne));
      color: var(--text-primary);
      font-family: var(--font-ui);
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100%;
      isolation: isolate;
    }

    .ambient {
      position: absolute;
      inset: -7.5vw -10vw;
      overflow: visible;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(3.5vw);
      opacity: 0.32;
      mix-blend-mode: screen;
      animation: drift 30s ease-in-out infinite alternate;
    }

    .blob:nth-child(1) {
      width: 46vw; height: 46vw; left: -12vw; top: -7.875vw;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.86), rgba(233, 210, 207, 0.17));
      animation-duration: 34s;
    }
    .blob:nth-child(2) {
      width: 34vw; height: 34vw; right: -8vw; top: 4.5vw;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.8), rgba(219, 227, 213, 0.2));
      animation-duration: 38s;
      animation-delay: -9s;
    }
    .blob:nth-child(3) {
      width: 45vw; height: 45vw; left: 26vw; bottom: -15.1875vw;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.74), rgba(242, 232, 220, 0.2));
      animation-duration: 36s;
      animation-delay: -14s;
    }

    @keyframes drift {
      0% { transform: translate3d(-2%, 1%, 0) scale(1); }
      50% { transform: translate3d(2.5%, -2.5%, 0) scale(1.04); }
      100% { transform: translate3d(-1%, 2%, 0) scale(0.99); }
    }

    .cinema {
      position: absolute;
      inset: 0;
      z-index: 2;
      padding: 3.5vw;
      display: grid;
      place-items: center;
    }

    .scene-layer {
      position: absolute;
      inset: 3.5vw;
      opacity: 0;
      transform: scale(1.01);
      transition: opacity 1.65s var(--ease-premium), transform 1.65s var(--ease-premium), filter 1.65s var(--ease-premium);
      will-change: opacity, transform, filter;
      filter: blur(0.125vw);
    }
    .scene-layer.active { opacity: 1; transform: scale(1); filter: blur(0); }

    .scene-shell {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: visible;
    }

    .scene-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }
    .scene-stage .frame { --rot: 0deg; --z: 1.15; transform-origin: center center; }

    .scene-shell.layout-text {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      text-align: center;
      background: linear-gradient(145deg, rgba(255,255,255,0.55), rgba(255,255,255,0.18));
      border: 0.0625vw solid rgba(255,255,255,0.6);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(0.75vw);
      padding: 4vw;
      padding-bottom: 5vw;
      animation: copyPlaqueFadeIn 0.7s var(--ease-premium) both;
    }

    .frame {
      position: absolute;
      border-radius: var(--radius);
      overflow: visible;
      padding: 0;
      box-shadow: none;
      background: transparent;
      border: 0;
      --rj: 0deg;
      transform: translate3d(var(--tx, 0), var(--ty, 0), 0) rotate(calc(var(--rot, 0deg) + var(--rj, 0deg))) scale(var(--z, 1));
      animation: var(--enterAnim, floatInSoft) 1300ms var(--ease-premium) both;
      animation-delay: var(--delay, 0ms);
    }
    .frame.enter-soft { --enterAnim: floatInSoft; }
    .frame.enter-left { --enterAnim: floatInLeft; }
    .frame.enter-right { --enterAnim: floatInRight; }
    .frame.enter-up { --enterAnim: floatInUp; }

    .frame::after {
      content: none;
    }

    .frame.frameless {
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }
    .frame.frameless::after { content: none; }
    .frame.soft-border {
      border: 0;
      box-shadow: none;
    }

    .frame-image-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: calc(var(--radius) - 5px);
      overflow: visible;
      background: transparent;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .frame img {
      border-radius: calc(var(--radius) - 5px);
      position: absolute;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      transform-origin: center;
      filter: saturate(1.02) contrast(1.01) drop-shadow(0 0.5vw 1vw rgba(108, 78, 69, 0.1));
      --m1x: 0px;
      --m1y: 0px;
      --m2x: 0px;
      --m2y: 0px;
      --m3x: 0px;
      --m3y: 0px;
      --m0r: 0deg;
      --m1r: 0deg;
      --m2r: 0deg;
      --m3r: 0deg;
      --s0: 1;
      --s1: 1;
      --s2: 1;
      --s3: 1;
      animation: photoChaosDrift var(--driftDuration, 32s) cubic-bezier(0.42, 0, 0.58, 1) infinite;
      animation-delay: calc(var(--delay, 0ms) * 0.6);
      will-change: transform;
    }

    .frame.slow img { animation-duration: calc(var(--driftDuration, 32s) * 1.22); }
    .frame.drift-a img { animation-duration: calc(var(--driftDuration, 32s) * 0.92); }
    .frame.drift-b img { animation-duration: calc(var(--driftDuration, 32s) * 1.05); }
    .frame.drift-c img { animation-duration: calc(var(--driftDuration, 32s) * 0.88); }
    .frame.drift-d img { animation-duration: calc(var(--driftDuration, 32s) * 1.12); }
    .frame.drift-e img { animation-duration: calc(var(--driftDuration, 32s) * 0.98); }
    .frame.drift-f img { animation-duration: calc(var(--driftDuration, 32s) * 1.08); }

    @keyframes photoChaosDrift {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(var(--m0r)) scale(var(--s0));
      }
      25% {
        transform: translate3d(var(--m1x), var(--m1y), 0) rotate(var(--m1r)) scale(var(--s1));
      }
      50% {
        transform: translate3d(var(--m2x), var(--m2y), 0) rotate(var(--m2r)) scale(var(--s2));
      }
      75% {
        transform: translate3d(var(--m3x), var(--m3y), 0) rotate(var(--m3r)) scale(var(--s3));
      }
    }

    @keyframes floatInSoft {
      from { opacity: 0; transform: translate3d(0, 1vw, 0) rotate(calc(var(--rot, 0deg) + var(--rj, 0deg))) scale(0.97); }
      to { opacity: 1; transform: translate3d(var(--tx, 0), var(--ty, 0), 0) rotate(calc(var(--rot, 0deg) + var(--rj, 0deg))) scale(var(--z, 1)); }
    }
    @keyframes floatInLeft {
      from { opacity: 0; transform: translate3d(-2.125vw, 0.5vw, 0) rotate(calc(var(--rot, 0deg) + var(--rj, 0deg) - 1.3deg)) scale(0.96); }
      to { opacity: 1; transform: translate3d(var(--tx, 0), var(--ty, 0), 0) rotate(calc(var(--rot, 0deg) + var(--rj, 0deg))) scale(var(--z, 1)); }
    }
    @keyframes floatInRight {
      from { opacity: 0; transform: translate3d(2.125vw, 0.5vw, 0) rotate(calc(var(--rot, 0deg) + var(--rj, 0deg) + 1.3deg)) scale(0.96); }
      to { opacity: 1; transform: translate3d(var(--tx, 0), var(--ty, 0), 0) rotate(calc(var(--rot, 0deg) + var(--rj, 0deg))) scale(var(--z, 1)); }
    }
    @keyframes floatInUp {
      from { opacity: 0; transform: translate3d(0, 1.875vw, 0) rotate(calc(var(--rot, 0deg) + var(--rj, 0deg))) scale(0.95); }
      to { opacity: 1; transform: translate3d(var(--tx, 0), var(--ty, 0), 0) rotate(calc(var(--rot, 0deg) + var(--rj, 0deg))) scale(var(--z, 1)); }
    }

    .scene-copy {
      position: absolute;
      left: 2.75vw;
      bottom: 2.75vw;
      max-width: 57.5vw;
      font-family: var(--font-ui);
      color: #111111;
      text-shadow: none;
      animation: copyPlaqueFadeIn 0.7s var(--ease-premium) both;
      pointer-events: none;
      padding: 1.25vw 1.5vw;
      border-radius: 1.125vw;
      border: 0.0625vw solid rgba(255,255,255,0.68);
      background: linear-gradient(140deg, rgba(255,255,255,0.72), rgba(250,245,239,0.5));
      backdrop-filter: blur(0.0vw);
      box-shadow: 0 0.625vw 1.875vw rgba(108, 90, 84, 0.1);
    }
    .scene-copy.top-right {
      left: auto;
      right: 2.75vw;
      top: 2.75vw;
      bottom: auto;
      text-align: right;
    }
    .scene-copy.top-left {
      top: 1.5vw;
      bottom: auto;
    }
    .scene-copy.centered {
      left: 50%;
      right: auto;
      top: auto;
      bottom: 2.75vw;
      transform: translateX(-50%);
      text-align: center;
      max-width: 65vw;
    }
    .scene-shell.chapter-vstuplenie .scene-copy.centered {
      bottom: 3.25vw;
      max-width: 70vw;
    }
    .scene-shell.chapter-novaya-glava .scene-copy.centered {
      bottom: 2.75vw;
      max-width: 72.5vw;
      text-shadow: 0 0.5vw 2.625vw rgba(0,0,0,0.34);
    }
    .scene-shell.chapter-novaya-glava .scene-copy h2 {
      font-size: 1.875vw;
      letter-spacing: 0.04em;
    }

    .scene-copy h2, .text-title {
      margin: 0 0 0.5vw 0;
      font-family: var(--font-heading);
      font-size: 3.375vw;
      font-weight: 500;
      letter-spacing: 0.025em;
      line-height: 1.03;
    }

    .scene-copy p, .text-subtitle {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 1vw;
      line-height: 1.48;
      color: #1a1a1a;
      letter-spacing: 0.02em;
      font-weight: 300;
    }

    .text-title {
      color: var(--text-primary);
      text-shadow: none;
      margin-bottom: 0.75vw;
    }
    .text-subtitle {
      color: var(--text-soft);
      text-shadow: none;
      max-width: 43.75vw;
      margin: 0 auto;
    }

    @keyframes copyPlaqueFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .chapter-chip {
      font-family: var(--font-ui);
      position: absolute;
      top: 2.25vw;
      left: 2.5vw;
      z-index: 8;
      padding: 0.5625vw 0.875vw;
      border-radius: 62.4375vw;
      border: 0.0625vw solid var(--line);
      background: var(--glass);
      backdrop-filter: blur(0.5vw);
      color: var(--text-soft);
      font-size: 0.75vw;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .ui {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 10;
      padding: 1.25vw 2vw;
      display: grid;
      gap: 0.625vw;
      pointer-events: none;
    }

    .progress-track {
      width: 100%;
      height: 0.125vw;
      border-radius: 62.4375vw;
      background: rgba(255, 255, 255, 0.42);
      overflow: visible;
      clip-path: inset(0 round 62.4375vw);
      box-shadow: inset 0 0 0 0.0625vw rgba(117, 91, 80, 0.09);
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, rgba(233,210,207,0.85), rgba(255,255,255,0.92));
      transition: width 110ms linear;
    }

    .controls {
      justify-self: center;
      display: inline-flex;
      align-items: center;
      gap: 0.375vw;
      padding: 0.375vw;
      border-radius: 62.4375vw;
      background: rgba(255, 255, 255, 0.26);
      backdrop-filter: blur(0.625vw);
      border: 0.0625vw solid rgba(255, 255, 255, 0.64);
      box-shadow: 0 0.5vw 1.5vw rgba(116, 88, 77, 0.14);
      pointer-events: auto;
    }

    .btn {
      font-family: var(--font-ui);
      border: 0;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.62);
      color: var(--text-primary);
      border-radius: 62.4375vw;
      min-width: 2.125vw;
      height: 2.125vw;
      padding: 0 0.75vw;
      font-size: 0.75vw;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.02em;
      transition: transform 0.24s var(--ease-premium), background 0.24s var(--ease-premium), opacity 0.24s, box-shadow 0.24s var(--ease-premium);
    }
    .btn:hover {
      transform: translateY(-0.0625vw);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0.5vw 1vw rgba(119, 88, 74, 0.14);
    }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.45; cursor: default; }

    .intro {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 4vw;
      background: linear-gradient(155deg, rgba(255,255,255,0.72), rgba(255,248,241,0.42));
      backdrop-filter: blur(0.625vw);

      const SLIDE_ORDER = [

        { folder: "02_groom_childhood", chapter: "История Владимира", title: "Детство", subtitle: "Тёплые воспоминания о первых годах.", duration: 12300, motionSeed: "slow pan-up" },

        { folder: "03_groom_family_brothers_one_more", chapter: "История Владимира", title: "Родные рядом", subtitle: "Ещё одна важная семейная глава.", duration: 11400, motionSeed: "pan-right" },

        { folder: "08_bride_growing_up", chapter: "История Алины", title: "Её взросление", subtitle: "Нежность, сила и красота пути.", duration: 11400, motionSeed: "slow pan-right" },

      ];

      function inferSceneType(imageCount) {
        if (imageCount <= 1) return "hero";
        if (imageCount === 2) return "duo";
        if (imageCount === 3) return "trio";
        return "collage";
      }

      function buildMotionList(imageCount, seed) {
        const pool = [seed || "slow pan-up", "pan-left", "pan-right", "pan-up", "pan-down", "slow pan-left", "slow pan-right"];
        return Array.from({ length: imageCount }, (_v, idx) => pool[idx % pool.length]);
      }

      function sceneFromFolder(slide) {
        const names = FOLDER_IMAGES[slide.folder] || [];
        if (!names.length) {
          if (!slide.fallbackText) return null;
          return {
            chapter: slide.chapter,
            type: "text",
            duration: slide.duration || APP.timings.defaultDuration,
            title: slide.title,
            subtitle: slide.subtitle
          };
        }
        const images = names.map((name) => folderPick(slide.folder, name));
        return {
          chapter: slide.chapter,
          type: slide.preferredType || inferSceneType(images.length),
          duration: slide.duration || APP.timings.defaultDuration,
          title: slide.title || "",
          subtitle: slide.subtitle || "",
          images,
          motion: buildMotionList(images.length, slide.motionSeed)
        };
      }

      const SCENES = SLIDE_ORDER
        .map(sceneFromFolder)
        .filter(Boolean);

        muteBtn: document.getElementById("muteBtn"),

      };

      const state = {

        timer: null,

        currentDuration: APP.timings.defaultDuration,
        elapsedBeforePause: 0,
        remainingMs: APP.timings.defaultDuration,
        raf: null,
        activeLayer: "A",
        audioUnlocked: false,
        audioMissing: false,
        currentAudioPhase: 1,
        crossfadeRaf: null
      };

      const audioA = new Audio(safePath(APP.audio.phaseOneTrack));
      const audioB = new Audio(safePath(APP.audio.phaseTwoTrack));
      [audioA, audioB].forEach((track) => {
        track.preload = "none";
        track.loop = true;
        track.volume = 0;
      });

      function disableAudioControl() {
        state.audioMissing = true;
        dom.muteBtn.disabled = true;
        dom.muteBtn.textContent = "Нет аудио";
      }

      audioA.addEventListener("error", disableAudioControl);
      audioB.addEventListener("error", disableAudioControl);

      function resolveMotion(extraClass, idx, scene) {
        const token = (extraClass || "").toLowerCase();
        const chapterSeed = ((scene && scene.chapter) ? scene.chapter.length : 0) + ((scene && scene.title) ? scene.title.length : 0);
        const driftPool = ["drift-a", "drift-b", "drift-c", "drift-d", "drift-e", "drift-f"];
        const drift = token.includes("left") ? "drift-b"
          : token.includes("right") ? "drift-d"
          : token.includes("down") ? "drift-a"
          : token.includes("up") ? "drift-c"
          : driftPool[(idx + chapterSeed) % driftPool.length];
        const enter = token.includes("left") ? "enter-left"
          : token.includes("right") ? "enter-right"
          : token.includes("up") ? "enter-up"
          : "enter-soft";
        const slow = token.includes("slow") ? "slow" : "";
        return [drift, enter, slow].filter(Boolean).join(" ");
      }

      function getCopyClass(scene) {
        if (scene.type === "text") return "";
        if (scene.chapter === "Вступление" && scene.type === "hero") return "centered";
        if (scene.chapter === "Их встреча" && scene.type === "text") return "centered";
        if (scene.chapter === "Их встреча") return "centered";
        if (scene.chapter === "Их история" && scene.type === "trio") return "top-left";
        if (scene.chapter === "История Алины") return "top-right";
        if (scene.chapter === "Новая глава") return "centered";
        return "top-left";
      }

      function getFrameStyleClass(scene, idx, total) {
        const chapter = scene && scene.chapter ? scene.chapter : "";
        if (total === 1) return "frameless soft-border";
        if (chapter === "Новая глава" && idx === total - 1) return "frameless soft-border";
        if (idx % 2 === 0) return "frameless";
        return "soft-border";
      }

      function applyFrameTiming(wrap, idx, scene) {
        const chapter = scene && scene.chapter ? scene.chapter : "";
        const baseDelay = chapter === "Их встреча" ? 220
          : chapter === "Новая глава" ? 280
          : chapter === "Вступление" ? 160
          : 120;
        const stagger = chapter === "Их история" ? 230 : 180;
        const delay = baseDelay + idx * stagger;
        wrap.style.setProperty("--delay", delay + "ms");
        const phase = (idx + 1) * 17 + (chapter.length * 5);
        const duration = 26 + ((phase % 13) * 1.35);
        wrap.style.setProperty("--driftDuration", duration.toFixed(2) + "s");
      }

      function hashString(str) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function mulberry32(seed) {
        return function () {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function applySlotChaos(wrap, idx, total, scene) {
        const ch = scene && scene.chapter ? scene.chapter : "";
        const ttl = scene && scene.title ? scene.title : "";
        const seed = hashString(ch + "|" + ttl + "|" + total + "|" + idx);
        const rnd = mulberry32(seed);
        const soloJam = total <= 1 ? 0.38 : 1;
        const layoutJam = total <= 1 ? 1 : total <= 3 ? 0.8 : total <= 6 ? 0.48 : 0.35;
        const tx = (rnd() - 0.5) * 0.88 * soloJam * layoutJam;
        const ty = (rnd() - 0.5) * 0.76 * soloJam * layoutJam;
        const rj = (rnd() - 0.5) * 20 * soloJam * layoutJam;
        wrap.style.setProperty("--tx", tx.toFixed(4) + "vw");
        wrap.style.setProperty("--ty", ty.toFixed(4) + "vw");
        wrap.style.setProperty("--rj", rj.toFixed(3) + "deg");
      }

      function chaoticPxDisplacement(rnd) {
        const magBase = (60 + rnd() * 30) * 0.2;
        return (rnd() < 0.5 ? -1 : 1) * magBase;
      }

      function chaoticScaleBand10to20(rnd, tighten) {
        const t = tighten == null ? 1 : Math.max(0.25, Math.min(1, tighten));
        const pct = (10 + rnd() * 10) * t / 100;
        return { lo: 1 - pct, hi: 1 + pct };
      }

      function chaoticRot10to15(rnd) {
        const mag = 10 + rnd() * 5;
        return (rnd() < 0.5 ? -1 : 1) * mag;
      }

      function applyImageChaosWaypoints(img, scene, idx, srcPath) {
        const ch = scene && scene.chapter ? scene.chapter : "";
        const ttl = scene && scene.title ? scene.title : "";
        const seed = hashString(ch + "|" + ttl + "|photo-orbit|" + idx + "|" + (srcPath || ""));
        const rnd = mulberry32(seed);
        const totalImg = scene && scene.images ? scene.images.length : 1;
        const orbitJam = totalImg <= 2 ? 1 : totalImg <= 5 ? 0.55 : totalImg <= 8 ? 0.42 : 0.32;
        const setPxVar = (name, n) => {
          img.style.setProperty(name, n.toFixed(2) + "px");
        };

        img.style.setProperty("--m0r", "0deg");
        setPxVar("--m1x", chaoticPxDisplacement(rnd) * orbitJam);
        setPxVar("--m1y", chaoticPxDisplacement(rnd) * orbitJam);
        setPxVar("--m2x", chaoticPxDisplacement(rnd) * orbitJam);
        setPxVar("--m2y", chaoticPxDisplacement(rnd) * orbitJam);
        setPxVar("--m3x", chaoticPxDisplacement(rnd) * orbitJam);
        setPxVar("--m3y", chaoticPxDisplacement(rnd) * orbitJam);
        const r1 = chaoticRot10to15(rnd) * orbitJam;
        const r2 = chaoticRot10to15(rnd) * orbitJam;
        const r3 = chaoticRot10to15(rnd) * orbitJam;
        const { lo: sLo, hi: sHi } = chaoticScaleBand10to20(rnd, orbitJam);
        const flip = rnd() < 0.5;
        img.style.setProperty("--m1r", r1.toFixed(3) + "deg");
        img.style.setProperty("--m2r", r2.toFixed(3) + "deg");
        img.style.setProperty("--m3r", r3.toFixed(3) + "deg");
        img.style.setProperty("--s0", "1");
        img.style.setProperty("--s1", (flip ? sHi : sLo).toFixed(4));
        img.style.setProperty("--s2", (sLo + (sHi - sLo) * rnd()).toFixed(4));
        img.style.setProperty("--s3", (rnd() < 0.5 ? sHi : sLo).toFixed(4));
      }

      function createImage(path, extraClass, idx, total, scene) {
        const safeIdx = Number.isFinite(idx) ? idx : 0;
        const safeTotal = Number.isFinite(total) && total > 0 ? total : 1;
        const wrap = document.createElement("div");
        const countClass = "slot-" + Math.min(safeIdx + 1, SCENE_STAGE_MAX_SLOTS);
        wrap.className = "frame " + getFrameStyleClass(scene, safeIdx, safeTotal) + " " + countClass + " " + resolveMotion(extraClass, safeIdx, scene);
        applyFrameTiming(wrap, safeIdx, scene);
        applySlotChaos(wrap, safeIdx, safeTotal, scene);

        const inner = document.createElement("div");
        inner.className = "frame-image-wrap";

        const img = document.createElement("img");
        img.src = safePath(path);
        img.alt = "Свадебное воспоминание";
        img.loading = "eager";
        applyImageChaosWaypoints(img, scene, safeIdx, path);

        img.onerror = () => {
          img.remove();
          const fallback = document.createElement("div");
          fallback.className = "asset-fallback";
          fallback.textContent = "Изображение недоступно";
          inner.appendChild(fallback);
        };

        inner.appendChild(img);
        wrap.appendChild(inner);
        return wrap;
      }

      function createSceneNode(scene) {
        const shell = document.createElement("div");
        shell.className = "scene-shell";
        const chapterClassMap = {
          "Вступление": "vstuplenie",
          "История Владимира": "istoriya-vladimira",
          "История Алины": "istoriya-aliny",
          "Их встреча": "ih-vstrecha",
          "Их история": "ih-istoriya",
          "Новая глава": "novaya-glava"
        };
        const chapterClass = chapterClassMap[scene.chapter || ""] || "";
        if (chapterClass) shell.classList.add("chapter-" + chapterClass);

        if (scene.type === "text") {
          shell.classList.add("layout-text");
          const t = document.createElement("h2");
          t.className = "text-title";
          t.textContent = scene.title || "";
          const p = document.createElement("p");
          p.className = "text-subtitle";
          p.textContent = scene.subtitle || "";
          shell.append(t, p);
          return shell;
        }

        const stage = document.createElement("div");
        const imageCount = (scene.images || []).length;
        stage.className = "scene-stage count-" + Math.min(Math.max(imageCount, 1), SCENE_STAGE_MAX_SLOTS);

        (scene.images || []).forEach((path, idx) => {
          const motionClass = (scene.motion && scene.motion[idx]) ? scene.motion[idx] : "";
          stage.appendChild(createImage(path, motionClass, idx, imageCount, scene));
        });
        shell.appendChild(stage);

        if (scene.title || scene.subtitle) {
          const copy = document.createElement("div");
          copy.className = "scene-copy " + getCopyClass(scene);
          if (scene.title) {
            const h2 = document.createElement("h2");
            h2.textContent = scene.title;
            copy.appendChild(h2);
          }
          if (scene.subtitle) {
            const p = document.createElement("p");
            p.textContent = scene.subtitle;
            copy.appendChild(p);
          }
          shell.appendChild(copy);
        }
        return shell;
      }

      function getActiveLayer() {
        return state.activeLayer === "A" ? dom.layerA : dom.layerB;
      }

      function getInactiveLayer() {
        return state.activeLayer === "A" ? dom.layerB : dom.layerA;
      }

      function render(index, immediate) {
        const scene = SCENES[index];
        if (!scene) return;

        const next = getInactiveLayer();
        const current = getActiveLayer();
        next.innerHTML = "";
        next.appendChild(createSceneNode(scene));
        dom.chapterChip.textContent = scene.chapter || "";

        if (immediate) {
          current.classList.remove("active");
          next.classList.add("active");
          state.activeLayer = state.activeLayer === "A" ? "B" : "A";
          return;
        }

        next.classList.add("active");
        current.classList.remove("active");
        state.activeLayer = state.activeLayer === "A" ? "B" : "A";
      }

      function normalizeSceneIndex(raw) {
        const n = SCENES.length;
        if (n === 0) return 0;
        if (raw < 0) return (raw % n + n) % n;
        if (raw >= n) return n - 1;
        return raw;
      }

      function isLastScene(index) {
        return SCENES.length === 0 || index >= SCENES.length - 1;
      }

      function startProgress(sceneDuration) {
        cancelAnimationFrame(state.raf);
        state.sceneStart = performance.now() - state.elapsedBeforePause;
        state.currentDuration = sceneDuration || APP.timings.defaultDuration;

        const tick = (t) => {
          const elapsed = t - state.sceneStart;
          const pct = Math.max(0, Math.min(1, elapsed / state.currentDuration));
          dom.progressBar.style.width = (pct * 100).toFixed(3) + "%";
          if (!state.playing) return;
          if (isLastScene(state.index) && pct >= 1) return;
          state.raf = requestAnimationFrame(tick);
        };
        state.raf = requestAnimationFrame(tick);
      }

      function scheduleAdvance() {
        clearTimeout(state.timer);
        state.timer = null;
        const scene = SCENES[state.index];
        const duration = scene && scene.duration ? scene.duration : APP.timings.defaultDuration;
        state.currentDuration = duration;
        if (!state.elapsedBeforePause || state.elapsedBeforePause > duration) {
          state.elapsedBeforePause = 0;
        }
        state.remainingMs = Math.max(0, duration - state.elapsedBeforePause);
        startProgress(duration);
        if (!state.playing) return;
        if (isLastScene(state.index)) return;
        state.timer = setTimeout(() => nextScene(), state.remainingMs);
      }

      function showScene(index, immediate) {
        state.index = normalizeSceneIndex(index);
        state.elapsedBeforePause = 0;
        render(state.index, !!immediate);
        syncMusicPhaseWithScene();
        scheduleAdvance();
      }

      function nextScene() {
        if (isLastScene(state.index)) return;
        showScene(state.index + 1, false);
      }

      function prevScene() {
        showScene(state.index - 1, false);
      }

      function setPlaying(playing) {
        state.playing = playing;
        dom.playPauseBtn.textContent = playing ? "Пауза" : "Продолжить";
        if (playing) {
          if (!state.audioMissing && state.audioUnlocked) {
            const activeTrack = state.currentAudioPhase === 1 ? audioA : audioB;
            activeTrack.play().catch(() => {});
          }
          scheduleAdvance();
        } else {
          state.elapsedBeforePause = Math.max(0, performance.now() - state.sceneStart);
          state.remainingMs = Math.max(0, state.currentDuration - state.elapsedBeforePause);
          clearTimeout(state.timer);
          cancelAnimationFrame(state.raf);
          audioA.pause();
          audioB.pause();
        }
      }

      function isSecondPhaseChapter(scene) {
        return !!scene && (scene.chapter === APP.audio.phaseSwitchChapter || scene.chapter === "Их история" || scene.chapter === "Новая глава");
      }

      function runCrossfade(fromTrack, toTrack, durationMs, targetVolume) {
        cancelAnimationFrame(state.crossfadeRaf);
        const start = performance.now();
        const fromStart = fromTrack.volume;
        const toStart = toTrack.volume;

        function step(now) {
          const progress = Math.min(1, (now - start) / durationMs);
          fromTrack.volume = Math.max(0, fromStart * (1 - progress));
          toTrack.volume = Math.min(targetVolume, toStart + (targetVolume - toStart) * progress);
          if (progress < 1) {
            state.crossfadeRaf = requestAnimationFrame(step);
          } else {
            fromTrack.pause();
            fromTrack.currentTime = 0;
            toTrack.volume = targetVolume;
          }
        }

        state.crossfadeRaf = requestAnimationFrame(step);
      }

      function syncMusicPhaseWithScene() {
        if (state.audioMissing || !state.audioUnlocked) return;
        const scene = SCENES[state.index];
        const shouldUsePhaseTwo = isSecondPhaseChapter(scene);
        const targetPhase = shouldUsePhaseTwo ? 2 : 1;
        if (targetPhase === state.currentAudioPhase) return;

        const fromTrack = state.currentAudioPhase === 1 ? audioA : audioB;
        const toTrack = targetPhase === 1 ? audioA : audioB;
        const phaseOneStartSec = Math.max(0, Number(APP.audio.phaseOneStartSec) || 0);
        if (targetPhase === 1) {
          toTrack.currentTime = phaseOneStartSec;
        } else {
          toTrack.currentTime = Math.max(0, toTrack.currentTime);
        }
        toTrack.play().catch(() => {});
        runCrossfade(fromTrack, toTrack, APP.audio.crossfadeMs, APP.audio.maxVolume);
        state.currentAudioPhase = targetPhase;
      }

      async function startAudioNarrative() {
        if (state.audioMissing) return;
        try {
          const phaseOneStartSec = Math.max(0, Number(APP.audio.phaseOneStartSec) || 0);
          state.currentAudioPhase = 1;
          audioA.currentTime = phaseOneStartSec;
          audioB.pause();
          audioB.currentTime = 0;
          await audioA.play();
          state.audioUnlocked = true;
        } catch (_err) {
          disableAudioControl();
          return;
        }

        const start = performance.now();
        const fadeMs = APP.audio.fadeInMs;
        const maxVolume = APP.audio.maxVolume;

        function ramp(t) {
          const p = Math.min(1, (t - start) / fadeMs);
          audioA.volume = p * maxVolume;
          if (p < 1) requestAnimationFrame(ramp);
        }
        requestAnimationFrame(ramp);
      }

      function toggleMute() {
        if (state.audioMissing) return;
        const nextMuted = !audioA.muted;
        audioA.muted = nextMuted;
        audioB.muted = nextMuted;
        dom.muteBtn.textContent = nextMuted ? "Без звука" : "Звук";
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      function initIntro() {
        dom.introNames.textContent = APP.coupleNames;
        dom.introDate.textContent = APP.weddingDate;
        dom.introPhrase.textContent = APP.openingPhrase;

        const introScene = SCENES[0];
        const introPath = introScene && introScene.images && introScene.images[0];
        if (introPath) {
          const introImg = createImage(introPath, "slow pan-up", 0, 1, { chapter: "Вступление" });
          dom.introMedia.appendChild(introImg.querySelector("img"));
        }
      }

      function bindEvents() {
        dom.startBtn.addEventListener("click", async () => {
          dom.introOverlay.classList.add("hidden");
          showScene(0, true);
          setPlaying(true);
          await startAudioNarrative();
        });

        dom.prevBtn.addEventListener("click", prevScene);
        dom.nextBtn.addEventListener("click", nextScene);
        dom.playPauseBtn.addEventListener("click", () => setPlaying(!state.playing));
        dom.muteBtn.addEventListener("click", toggleMute);
        dom.fsBtn.addEventListener("click", toggleFullscreen);

        document.addEventListener("keydown", (e) => {
          if (dom.introOverlay.classList.contains("hidden") === false) {
            if (e.code === "Enter") dom.startBtn.click();
            return;
          }
          if (e.code === "Space") {
            e.preventDefault();
            setPlaying(!state.playing);
          } else if (e.code === "ArrowRight") {
            nextScene();
          } else if (e.code === "ArrowLeft") {
            prevScene();
          } else if (e.key.toLowerCase() === "m") {
            toggleMute();
          } else if (e.key.toLowerCase() === "f") {
            toggleFullscreen();
          }
        });
      }

      function preloadFirstImages() {
        SCENES.slice(0, 7).forEach((scene) => {
          (scene.images || []).forEach((path) => {
            const img = new Image();
            img.src = safePath(path);
          });
        });
      }

      function init() {
        initIntro();
        bindEvents();
        preloadFirstImages();
        showScene(0, true);
        setPlaying(false);
      }

      init();
    })();
  </script>
</body>
</html>
